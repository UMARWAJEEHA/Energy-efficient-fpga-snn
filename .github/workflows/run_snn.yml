name: Run SNN Experiment

on:
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run LIF comparison
        working-directory: software
        run: python compare_lif_precision.py
